<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inventory Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Product Inventory Dashboard</h1>
            <p>Manage and monitor your product inventory</p>
        </header>

        <section class="controls">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Enter product name"
                >
                <button id="searchBtn">Search Button</button>
            </div>

            <div class="filter-container">
                <label for="categoryFilter">Category:</label>
                <select id="categoryFilter">
                    <option value="All">All</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Displays">Displays</option>
                    <option value="Storage">Storage</option>
                    <option value="Components">Components</option>
                </select>

                <button id="resetBtn">Reset Button</button>
            </div>
        </section>

        <section class="summary">
            <div class="summary-card">
                <h3>Total Inventory Value</h3>
                <p id="totalInventoryValue">₱0</p>
            </div>

            <div class="summary-card">
                <h3>Low-Stock Products</h3>
                <p id="lowStockCount">0</p>
            </div>

            <div class="summary-card">
                <h3>Out-of-Stock Products</h3>
                <p id="outOfStockCount">0</p>
            </div>
        </section>

        <section>
            <div id="noResultsMessage" class="no-results">
                No products found
            </div>

            <div id="productList" class="product-list"></div>
        </section>
    </div>

    <script type="module" src="js/main.js"></script>
</body>
</html>
